services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: veritas-postgres

    environment:
      POSTGRES_DB: veritas
      POSTGRES_USER: veritas_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - veritas_postgres_data:/var/lib/postgresql

volumes:
  veritas_postgres_data: