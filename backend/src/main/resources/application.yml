spring:
  application:
    name: veritas-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/veritas?options=-c%20TimeZone=Asia/Kolkata
    username: veritas_app
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  jackson:
    time-zone: Asia/Kolkata

security:
  jwt:
    secret-base64: ${SECURITY_JWT_SECRET_BASE64}
    expiration-ms: ${SECURITY_JWT_EXPIRATION_MS}

logging:
  level:
    org.springframework.security: DEBUG

veritas:
  storage:
    local:
      base-dir: ${STORAGE_LOCAL_BASE_DIR:./uploads/property-images}
  geocoding:
    enabled: ${GEOCODING_ENABLED:true}
    provider: ${GEOCODING_PROVIDER:nominatim}
    base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${GEOCODING_USER_AGENT:Veritas-Backend/1.0 (veritas-verification@veritas.local)}
    connect-timeout-ms: ${GEOCODING_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${GEOCODING_READ_TIMEOUT_MS:5000}
    min-interval-ms: ${GEOCODING_MIN_INTERVAL_MS:1000}
    match-distance-meters: ${GEOCODING_MATCH_DISTANCE_METERS:200.0}
    mismatch-distance-meters: ${GEOCODING_MISMATCH_DISTANCE_METERS:1000.0}
    min-confidence: ${GEOCODING_MIN_CONFIDENCE:0.3}