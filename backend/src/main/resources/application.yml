# ─── Phase 3B.7B: Information disclosure hardening ────────────────────────
# These settings ensure the default Spring Boot error page (/error endpoint)
# never leaks stack traces, exception messages, or binding-error internals.
# Our GlobalExceptionHandler provides the structured ApiErrorResponse for all
# handled exceptions; these are the last-resort belt-and-suspenders config.
server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: veritas-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/veritas?options=-c%20TimeZone=Asia/Kolkata
    username: veritas_app
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  jackson:
    time-zone: Asia/Kolkata

  # Pagination bounds (Phase 3B.4B): default page size 20 and a hard maximum of 100. The @PageableDefault
  # on the /my endpoints already defaults to 20; this caps an oversized client-supplied size (e.g.
  # size=100000) to 100 so a single request cannot amplify per-page work without bound.
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

security:
  jwt:
    secret-base64: ${SECURITY_JWT_SECRET_BASE64}
    expiration-ms: ${SECURITY_JWT_EXPIRATION_MS}

logging:
  level:
    org.springframework.security: DEBUG

veritas:
  storage:
    local:
      base-dir: ${STORAGE_LOCAL_BASE_DIR:./uploads/property-images}
  geocoding:
    enabled: ${GEOCODING_ENABLED:true}
    provider: ${GEOCODING_PROVIDER:nominatim}
    base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${GEOCODING_USER_AGENT:Veritas-Backend/1.0 (veritas-verification@veritas.local)}
    connect-timeout-ms: ${GEOCODING_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${GEOCODING_READ_TIMEOUT_MS:5000}
    min-interval-ms: ${GEOCODING_MIN_INTERVAL_MS:1000}
    match-distance-meters: ${GEOCODING_MATCH_DISTANCE_METERS:200.0}
    mismatch-distance-meters: ${GEOCODING_MISMATCH_DISTANCE_METERS:1000.0}
    min-confidence: ${GEOCODING_MIN_CONFIDENCE:0.3}